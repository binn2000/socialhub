openapi: 3.1.0
info:
  title: SocialHub API
  version: 1.0.0-draft
  summary: The single contract shared by the Laravel backend and the Flutter client.
  description: |
    **Status: DRAFT. Nothing in this file is implemented yet.** It was derived from the
    Flutter app as it stands on 2026-09-30 (models in `lib/models/`, seed data in
    `lib/data/mock_data.dart`, and the screens that use them). Where the real product needs
    something the Flutter app does not have yet, the endpoint is marked **[NEW]** and the
    gap is listed in the review notes delivered with this file.

    Approved decisions: Laravel API-only, MariaDB 10.1.38, Sanctum bearer tokens, `/api/v1`, JSON,
    OpenAPI, Laravel Storage (local in development, S3-compatible in production),
    polling chat, real comments, real image upload, database queue driver.

    ## General conventions

    | Topic | Rule |
    |---|---|
    | Base URL | `/api/v1`. Breaking changes require `/api/v2`. Adding fields, endpoints or enum values is **not** breaking. |
    | Headers | Every request sends `Accept: application/json` (otherwise Laravel may answer auth failures with an HTML redirect). Authenticated requests send `Authorization: Bearer <token>`. |
    | Field names | JSON is `camelCase`. Query parameters are single lowercase words (`q`, `cursor`, `limit`). URLs use kebab-case (`friend-requests`). |
    | IDs | 26-character lowercase ULID **strings** (time-sortable, not guessable). Clients treat them as opaque and never parse them. |
    | Timestamps | RFC 3339, UTC, second precision, always with `Z` (`2026-09-30T08:15:00Z`). The server never sends display text such as "15 phút trước"; the client formats relative time. |
    | Null handling | Keys are **always present**. A missing value is `null`. Empty collections are `[]`. Strings are `null` only where the schema says so (for example `content` is `""`, never `null`). Counts are non-negative integers. |
    | URLs | Absolute `https` URLs (`http` only in local development). `null` when there is no image. |
    | Envelope | One object: `{ "data": {...} }`. A collection: `{ "data": [...], "meta": { "nextCursor": "...", "hasMore": true } }`. Actions that only succeed return `204` with no body. |
    | Unknown values | Clients must ignore unknown fields and must fall back gracefully on unknown enum values. |
    | Language | The backend sends **identifiers, not UI text**. Flutter maps enums to Vietnamese labels (see the tables below). Error `message` strings are English developer text and must not be shown to users verbatim. |

    ### Authentication (Sanctum)

    * `register` and `login` return a plain-text token once: `{ "accessToken", "tokenType": "Bearer", "expiresAt" }`.
      The response never contains the password or the token hash.
    * Tokens expire **30 days** after creation (no sliding expiry, no refresh token in v1). After that the client must log in again.
    * The Flutter client stores the token only in `flutter_secure_storage` and attaches it with a `dio` interceptor.
    * A request with a missing, invalid, expired or revoked token gets `401` with `code: "unauthenticated"`. On that
      response the client deletes the stored token and shows the login screen. **Login failure is deliberately `422`,
      not `401`**, so a wrong password can never be confused with an expired session.
    * `logout` revokes only the token used for the request. Other devices keep working.

    ### Visibility and authorization model

    | Resource | Who can see it |
    |---|---|
    | Post `public` | Any authenticated user |
    | Post `friends` | The author and accepted friends of the author |
    | Post `only_me` | The author only |
    | Comments | Whoever can see the post |
    | Story | The author and accepted friends (24 hours) |
    | Profile (`GET /users/{user}`) | Any authenticated user (name, username, avatar, bio, counts) |
    | Conversation and messages | Its two participants only |
    | Notification | Its recipient only |

    Something the caller is not allowed to see is answered with **`404`, not `403`**, so its existence is not leaked.
    `403` is used when the resource is visible but the action is not allowed (for example deleting someone else's comment).

    ### Cursor pagination

    Every list endpoint uses the same query parameters `cursor` (opaque string from the previous `meta.nextCursor`)
    and `limit`, and returns `meta: { nextCursor, hasMore }`. `nextCursor` is `null` when `hasMore` is `false`.
    A cursor is only valid for the endpoint, filters and `q` it was issued for; otherwise the answer is `400 invalid_cursor`.
    Ordering is documented per endpoint. Clients de-duplicate by `id`, because lists can change between pages.

    ### Errors

    All errors use one shape. `code` is stable and machine-readable; `errors` appears only for `422`.

    ```json
    { "message": "Validation failed.", "code": "validation_failed",
      "errors": { "content": ["The content field is required."] } }
    ```

    | Status | Meaning | Typical `code` |
    |---|---|---|
    | 400 | Malformed request (bad JSON, bad cursor) | `bad_request`, `invalid_cursor` |
    | 401 | Not authenticated / token expired | `unauthenticated` |
    | 403 | Authenticated but not allowed | `forbidden`, `not_friends` |
    | 404 | Not found **or not visible to the caller** | `not_found` |
    | 409 | Valid request that conflicts with current state | `already_friends`, `friend_request_exists`, `idempotency_key_reused`, `request_in_progress` |
    | 413 | Upload larger than the server limit | `payload_too_large` |
    | 422 | Validation failed (including wrong login) | `validation_failed`, `invalid_credentials` |
    | 429 | Rate limit exceeded (`Retry-After` header, seconds) | `too_many_requests` |
    | 500 | Unexpected server error | `server_error` |

    Production responses never contain exception classes, stack traces, SQL or file paths.

    ### Uploads

    Posts, stories and the avatar accept `multipart/form-data`. There is no separate upload endpoint.

    * Field `image` (or `avatar`): `image/jpeg`, `image/png` or `image/webp`; at most **10 MB**; at most 8000 x 8000 px.
    * The server validates the real file content (not only the extension), re-encodes the image, strips EXIF
      metadata (including GPS) and stores it as `posts|stories|avatars/{yyyy}/{mm}/{ulid}.{jpg|png|webp}`
      on the configured Laravel disk. The API returns the resulting absolute URL.
    * Image URLs are unguessable but public (v1). See the review notes for the signed-URL alternative.
    * The Flutter client should resize/compress with `image_picker` (`maxWidth`, `imageQuality`) before uploading.
    * A file larger than the web server limit may be rejected with `413` before PHP runs.

    **Videos** (posts only, field `video`): `video/mp4`, `video/quicktime` or `video/webm`; at most **50 MB** and
    **60 seconds**. The server checks the real content with ffprobe, keeps the upload only until it has been
    converted, and stores one H.264/AAC mp4 (at most 720 px wide, `faststart`) plus a JPEG thumbnail beside it
    (`videos/{yyyy}/{mm}/{ulid}.mp4|jpg`). Conversion runs on the queue (ffmpeg must be installed), so a new video
    post is first `processing`: only its author sees it, with `video.url` and `video.thumbnailUrl` set to `null`.
    When the conversion ends the post becomes `ready` (visible according to its privacy) or `failed` (still visible
    to its author, who can delete it). Clients read the status again on refresh; there is no push for it.

    ### Idempotency (recommended)

    `POST /posts`, `/posts/{post}/comments`, `/stories` and `/conversations/{conversation}/messages` accept an optional
    `Idempotency-Key` header (client-generated UUID). Repeating a request with the same key and body within 24 hours
    returns the **original response** instead of creating a duplicate; the same key with a different body is `409`.
    This protects against double taps and retries after network timeouts.

    ### Rate limits (initial values, tunable)

    | Scope | Limit |
    |---|---|
    | `POST /auth/login` | 5 per minute per email + IP |
    | `POST /auth/register` | 10 per hour per IP |
    | Any other authenticated request | 120 per minute per user |
    | `POST /posts`, `POST /stories` | 30 per hour per user |
    | `POST /posts/{post}/comments` | 120 per hour per user |
    | `POST /conversations/{conversation}/messages` | 120 per minute per user |
    | `POST /friend-requests` | 60 per hour per user |

    ### Search

    `q` is trimmed (max 100 characters); blank means "no filter". Matching is `contains`, case-insensitive **and accent-insensitive
    for most characters** (MariaDB `utf8mb4_unicode_ci`; see the collation caveat in `x-database.charset` for stacked Vietnamese
    diacritics), so `minh` also finds `Mình`. This intentionally differs from the current Flutter
    `searchPosts()`, which is accent-sensitive. `%` and `_` in `q` are escaped. Posts match `content` or author `name`; users match
    `name` or `username`.

    ### Enum mapping (Flutter is responsible for labels)

    | `privacy` | Flutter label |
    |---|---|
    | `public` | Công khai |
    | `friends` | Bạn bè |
    | `only_me` | Chỉ mình tôi |

    | `feeling` | Flutter label (current UI) |
    |---|---|
    | `cheerful` | Cảm thấy vui (default) |
    | `excited` | Hứng thú |
    | `happy` | Hạnh phúc |

    | `background` (story) | Gradient colors (from `StoryCreatorScreen`) |
    |---|---|
    | `indigo` (default) | `#5D6BFF` → `#9B8CFF` |
    | `sunset` | `#FF7043` → `#FFC107` |
    | `mint` | `#00B894` → `#26C6DA` |
    | `berry` | `#E84393` → `#6C5CE7` |

    | Notification `type` | Text composed by Flutter |
    |---|---|
    | `like` | đã thích bài viết của bạn |
    | `comment` | đã bình luận trong bài viết của bạn |
    | `share` | đã chia sẻ bài viết của bạn |
    | `friend_request` | đã gửi lời mời kết bạn (was `friend` in the mock data) |
    | `friend_accepted` **[NEW]** | Text to be defined in Flutter |
    | `follow` **[NEW]** | đã bắt đầu theo dõi bạn |

    ### Reading guide

    Schemas carry `x-flutter-source` (the Flutter model they replace), `x-backend-entity` (the table that stores them),
    `x-computed` on fields that are calculated and never stored, and `x-not-exposed` for Flutter fields that deliberately
    have no API counterpart. The root `x-database` section proposes the MariaDB schema behind the API.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development (php artisan serve)
  - url: https://api.socialhub.example/api/v1
    description: Production (placeholder host)
tags:
  - name: Auth
    description: "Registration, login and logout"
  - name: Me
    description: "The authenticated user's own account"
  - name: Users
    description: "Other users and their profiles"
  - name: Friends
    description: "Friend requests and friendships"
  - name: Feed
    description: "Home feed and Explore"
  - name: Posts
    description: "Creating, reading and deleting posts"
  - name: Interactions
    description: "Like, save, hide and share"
  - name: Comments
    description: "Comments on posts"
  - name: Stories
    description: "24-hour stories"
  - name: Conversations
    description: "Direct messages (polling)"
  - name: Notifications
    description: "Notifications for the current user"
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account and sign in
      description: |
        **Authentication:** none. **Rate limit:** 10 per hour per IP.

        Creates the user and returns a new token, so the client is signed in immediately.
        A 6-digit verification code is emailed (see `POST /auth/email/verification`); nothing is blocked until the
        email is verified, the client only shows a reminder (`Me.emailVerified`).

        **Validation:** `name` 2-50 characters; `username` 3-30 characters, `a-z 0-9 _`, unique
        (case-insensitive), stored **without** `@`; `email` valid, max 255, unique (case-insensitive);
        `password` min 8, max 72 characters; `deviceName` optional, max 60 (label for the token).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example: {name: Minh Ánh, username: minh_anh, email: minh@example.com, password: correct-horse-battery, deviceName: iPhone 17 Pro}
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResultEnvelope'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        **Authentication:** none. **Rate limit:** 5 per minute per email + IP.

        Wrong email or password is `422` with `code: "invalid_credentials"` and a generic message that does not say
        which of the two was wrong. Each successful login creates a new token; existing tokens stay valid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResultEnvelope'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /auth/email/verification:
    post:
      tags: [Auth]
      operationId: sendEmailVerificationCode
      summary: "[NEW] Email me a verification code"
      description: |
        **Authentication:** required. **Rate limit:** 5 per hour per user (`429` after that).
        Emails a new 6-digit code to the account's address; the previous code stops working. The code is valid for
        15 minutes. Already verified: `409` with `code: already_verified`. The email is queued, so it can arrive a few
        seconds later. (A code is also sent automatically when the account is created.)
      responses:
        '202': {description: The email was queued.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: "[NEW] Confirm the emailed code"
      description: |
        **Authentication:** required. **Rate limit:** 10 per hour per user.
        Wrong, expired or missing code: `422` with `code: invalid_code`. After 5 wrong tries the code is discarded and a new
        one must be requested. Verifying again when already verified is `200` (idempotent). Returns the updated account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CodeRequest'}
            example: {code: '482913'}
      responses:
        '200':
          description: 'The account, with `emailVerified: true`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: "[NEW] Email me a password reset code"
      description: |
        **Authentication:** none. **Rate limit:** 5 per hour per email + IP.
        Always answers `202`, whether or not an account with that email exists, so the endpoint cannot be used to find out who
        has an account. If it does exist, a 6-digit code (valid 15 minutes) is emailed; asking again replaces it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '202': {description: If the account exists, a code was queued.}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: "[NEW] Set a new password with the emailed code"
      description: |
        **Authentication:** none. **Rate limit:** 10 per hour per email + IP.
        Wrong, expired or unknown email/code is one generic `422` with `code: invalid_code`. After 5 wrong tries the code is
        discarded. On success the password is changed, **every token of the account is revoked** (all devices are signed out)
        and the client signs in again with the new password. The password rules are those of `register`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Password changed.}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current token
      description: |
        **Authentication:** required. Revokes only the token sent with this request. Calling it with an already
        revoked token returns `401`, which the client treats as "already signed out".
      responses:
        '204': {description: Token revoked.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get the authenticated user
      description: |
        **Authentication:** required. Called at app start after a token is found, to replace the mock `currentUser`.
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update name and bio
      description: |
        **Authentication:** required. JSON only (images use `POST /me/avatar`, because PHP does not parse
        multipart bodies for `PATCH`). Only the fields present in the body are changed.

        **Validation:** `name` 2-50 characters, not blank after trimming (mirrors the Edit Profile screen);
        `bio` max 300 characters, may be `""` or `null` (both clear it).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMeRequest'}
            example: {name: Lê Anh Hùng, bio: Product Designer}
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

    delete:
      tags: [Me]
      operationId: deleteAccount
      summary: "[NEW] Delete my account"
      description: |
        **Authentication:** required. **Rate limit:** the general limit.
        Requires the current `password` (wrong: `422` with `code: invalid_credentials`). The account is soft-deleted
        immediately: all its tokens are revoked, its friendships and friend requests are removed, and its posts, comments,
        stories and messages disappear from every other user's screens. After a 30-day retention period a scheduled job
        deletes the rows and image files for good. The email and username stay reserved during the retention period.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteAccountRequest'}
      responses:
        '204': {description: Account deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me/devices:
    put:
      tags: [Me]
      operationId: registerDevice
      summary: "[NEW] Register this phone for push notifications"
      description: |
        **Authentication:** required. Stores the Firebase Cloud Messaging `token` of the phone for the caller. A token
        that was registered by another account moves to the caller (the same phone signed in as someone else).
        Calling it again with the same token is harmless. Pushes are sent for new notifications and chat messages
        by a queued job; with FCM not configured on the server nothing is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRequest'}
      responses:
        '204': {description: Registered.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Me]
      operationId: unregisterDevice
      summary: "[NEW] Stop push notifications on this phone"
      description: |
        **Authentication:** required. Forgets the `token` if it belongs to the caller; an unknown token is not an error.
        The app calls it before signing out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, maxLength: 512}
      responses:
        '204': {description: Done.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me/avatar:
    post:
      tags: [Me]
      operationId: setAvatar
      summary: "[NEW] Upload a new avatar"
      description: |
        **Authentication:** required. `multipart/form-data` with an `avatar` image (see Uploads). The previous
        avatar file is deleted. Not used by the current Flutter UI (`UserModel.copyWith` already supports `avatarUrl`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/AvatarUploadRequest'}
            encoding:
              avatar: {contentType: 'image/jpeg, image/png, image/webp'}
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Me]
      operationId: removeAvatar
      summary: "[NEW] Remove the avatar"
      description: '**Authentication:** required. Idempotent: succeeds even if there is no avatar.'
      responses:
        '200':
          description: The updated user (`avatarUrl` is `null`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me/cover:
    post:
      tags: [Me]
      operationId: setCover
      summary: Upload a cover image (profile header)
      description: |
        **Authentication:** required. `multipart/form-data` with a `cover` image (see Uploads). The previous cover
        file is deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover]
              properties:
                cover: {type: string, format: binary, description: 'image/jpeg, image/png or image/webp, max 10 MB.'}
            encoding:
              cover: {contentType: 'image/jpeg, image/png, image/webp'}
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Me]
      operationId: removeCover
      summary: Remove the cover image
      description: '**Authentication:** required. Idempotent.'
      responses:
        '200':
          description: The updated user (`coverUrl` is `null`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me/saved-posts:
    get:
      tags: [Me]
      operationId: listSavedPosts
      summary: "[NEW] My saved posts"
      description: |
        **Authentication:** required. The posts the caller saved with `PUT /posts/{post}/save`, **most recently saved
        first** (saved time descending, then post `id` descending). Only posts the caller may still see are listed: a
        post that was deleted, or whose visibility no longer includes the caller (for example the author set it to
        `only_me`, or they are no longer friends), is skipped. Posts the caller hid from their feed are included
        (`isHidden: true`); hiding does not affect saving. Every item has `isSaved: true`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of posts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Search users (Friends screen)
      description: |
        **Authentication:** required. Returns other users, never the caller (the Friends screen excludes the
        current user). Each item carries the caller's `friendship` with that user, which drives the
        "Thêm bạn / Đang chờ / Bạn bè" button.

        **Order:** `name` ascending, then `id`. **Query:** `q` (see Search), `relationship` filters by friendship status.
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: relationship
          in: query
          description: Only users with this friendship status towards the caller.
          schema: {$ref: '#/components/schemas/OtherFriendshipStatus'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user's profile
      description: |
        **Authentication:** required. Any authenticated user may view any profile, except one who blocked the caller
        (`404`). Use `GET /users/{user}/posts` for their posts. For the caller's own id, `friendship.status` is
        `self`. `isBlocked` tells whether the caller blocked this user (their posts are then not listed).
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfileEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/follow:
    put:
      tags: [Users]
      operationId: followUser
      summary: Follow a user
      description: |
        **Authentication:** required. **Idempotent.** Following is one-way and needs no approval. It is separate from
        friendship, but friends follow each other automatically when a friend request is accepted (and every pair of
        friends from before that rule was added was made to follow each other once). Unfriending does not remove
        a follow; unfollowing does not end a friendship. The followed person gets one `follow` notification. A followed
        person's **public** posts appear in the follower's feed (`filter=all` and `filter=following`). Following
        yourself is `422`; a user who blocked the caller, or whom the caller blocked, is `404`. Blocking someone
        removes follows in both directions. Limited like friend requests (60 per hour).
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      responses:
        '204': {description: The caller follows the user.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Users]
      operationId: unfollowUser
      summary: Stop following a user
      description: '**Authentication:** required. Idempotent.'
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      responses:
        '204': {description: The caller does not follow the user.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/followers:
    get:
      tags: [Users]
      operationId: listFollowers
      summary: People who follow a user
      description: |
        **Authentication:** required. Followers of `{user}`, without the caller, blocked people and deleted accounts.
        A user who blocked the caller is `404`. Items are `UserListItem`. **Order:** `name`, then `id`.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/following:
    get:
      tags: [Users]
      operationId: listFollowing
      summary: People a user follows
      description: 'Same as `GET /users/{user}/followers`, for the people `{user}` follows.'
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me/note:
    put:
      tags: [Notes]
      operationId: setNote
      summary: Share a note (a short text on your avatar for 24 hours)
      description: |
        **Authentication:** required. Creates the caller's note or **replaces** the one they have (a person has at most
        one). `text` is 1-60 characters after trimming (emoji count as one each). The note disappears 24 hours after
        it was last set. Setting a note again restarts the 24 hours. Limited to 30 per hour.

        **Privacy:** `privacy` is `public`, `friends` (the default for a new note) or `only_me`, like a post. Friends see
        `friends` and `public` notes in their Notes row; people who follow the caller see `public` ones there too;
        anyone can see a `public` note on the caller's profile (`UserProfile.note`). Leaving `privacy` out keeps the
        note's current value when it is replaced.

        **Music:** `trackId` (an id from `GET /music/search`) attaches a song. The server looks the song up again in the
        catalogue, so only real catalogue songs and previews can be attached (`422` on `trackId` otherwise). With a
        song the text may be empty. If Spotify is configured on the server, the song's Spotify link is stored too.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetNoteRequest'}
            example: {text: Đang học bài 📚}
      responses:
        '200':
          description: The caller's note.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Notes]
      operationId: deleteNote
      summary: Remove my note
      description: '**Authentication:** required. Idempotent.'
      responses:
        '204': {description: The caller has no note.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /music/search:
    get:
      tags: [Music]
      operationId: searchMusic
      summary: Find a song to attach to a note or a story
      description: |
        **Authentication:** required. Searches the Apple Music / iTunes catalogue (the Vietnamese storefront by
        default, so Vietnamese songs are found) and returns up to 20 songs, each with a **30-second preview**
        (`previewUrl`) and a link to the song on Apple Music. Previews are for listening only: always show the
        Apple Music link next to the player. Results are cached for an hour. Limited to 30 per minute.
        If the catalogue cannot be reached the answer is `503` with `code: music_unavailable`.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
      responses:
        '200':
          description: The songs found (possibly none).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrackList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {description: The music catalogue is unavailable., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/stories:
    get:
      tags: [Stories]
      operationId: listUserStories
      summary: The active stories of one person
      description: |
        **Authentication:** required. The unexpired stories of `{user}` that the caller may see: their own, `friends`
        and `public` stories of friends, and `public` stories of anyone else. A user who blocked the caller is `404`.
        Newest first, at most 30. Use it to open the stories of someone from their profile.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      responses:
        '200':
          description: The stories.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoryList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /stories/{story}:
    patch:
      tags: [Stories]
      operationId: updateStoryPrivacy
      summary: Change who can see a story
      description: '**Authentication:** required. The author only (`403` for someone else who can see it, `404` if the caller cannot see it). Effective at once.'
      parameters:
        - name: story
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privacy]
              properties:
                privacy: {$ref: '#/components/schemas/Privacy'}
      responses:
        '200':
          description: The updated story.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoryEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Stories]
      operationId: deleteStory
      summary: "[NEW] Delete my story"
      description: |
        **Authentication:** required. **Authorization:** the author only (`403` for someone else's visible story,
        `404` if not visible). Expired stories are purged automatically by a scheduled job.
      parameters:
        - name: story
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '204': {description: Story deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: Notes of me and my friends
      description: |
        **Authentication:** required. The caller's own note (first) and the notes of their accepted friends that have
        not expired, newest first, that the caller may see (`friends` and `public` notes of friends, `public` notes of
        people the caller follows). Strangers, blocked people and deleted accounts never appear. At most 100 notes;
        there is no paging. Shown as a row on the Messages screen.
      responses:
        '200':
          description: The notes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NoteList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me/presence:
    post:
      tags: [Me]
      operationId: touchPresence
      summary: Say "I am online"
      description: |
        **Authentication:** required. Every authenticated request already refreshes the caller's `lastSeenAt` (at most
        once a minute); this empty call is for an app that is open but idle (for example when it returns to the
        foreground). Call it about every minute while the app is in the foreground.
      responses:
        '204': {description: Noted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /conversations/{conversation}/typing:
    put:
      tags: [Conversations]
      operationId: setTyping
      summary: Say "I am typing"
      description: |
        **Authentication:** required. **Authorization:** participants only (else `404`), and only while the two are
        friends (`403`, `code: not_friends`). Marks the caller as typing for the next 6 seconds; repeat about every
        3 seconds while the person keeps typing. Sending a message clears it. The other person sees it as
        `meta.otherTyping` of `GET .../messages` (the polling call), so there is no delay beyond the polling interval.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      responses:
        '204': {description: Noted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Conversations]
      operationId: clearTyping
      summary: Say "I stopped typing"
      description: '**Authentication:** required. Idempotent. Participants only (else `404`).'
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      responses:
        '204': {description: Noted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/suggestions:
    get:
      tags: [Users]
      operationId: listSuggestedUsers
      summary: People you may know (Friends screen)
      description: |
        **Authentication:** required. People the caller has **no relationship with at all** (not a friend, no pending
        request either way, not blocked, not themselves). Ranked by the number of friends in common
        (`mutualFriendsCount` descending); people with none follow, newest accounts first, so a new account still
        gets a list. Items are `UserListItem` (their `friendship.status` is always `none`).

        **Paging:** the order is computed, so the `cursor` is an opaque position and the list can shift slightly
        between pages.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/friends:
    get:
      tags: [Users]
      operationId: listUserFriends
      summary: A user's friends (profile "Friends" tab)
      description: |
        **Authentication:** required. The accepted friends of `{user}` (for the caller's own id, the caller's
        friends). The caller is left out of the list, and so is anyone who blocked or is blocked by the caller.
        A user who blocked the caller is `404`. Items are `UserListItem`, so the caller's own relationship to each
        friend (and the mutual friends) is there for the friend buttons.

        **Order:** `name` ascending, then `id`.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/photos:
    get:
      tags: [Users]
      operationId: listUserPhotos
      summary: A user's photos (profile "Photos" tab)
      description: |
        **Authentication:** required. The images of the posts written by `{user}` that the caller may see (same
        visibility rule as `GET /users/{user}/posts`). One item per **image** (a post with 3 images gives 3 items, same `postId`). A user who blocked
        the caller is `404`.

        **Order:** newest image first.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of photos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/block:
    put:
      tags: [Users]
      operationId: blockUser
      summary: Block a user
      description: |
        **Authentication:** required. **Idempotent.** Blocking removes any friendship or friend request between the
        two people, and from then on each side is invisible to the other: neither sees the other's posts, comments,
        stories or profile (`404`), in lists or search; no friend request, message or notification can pass between
        them, and an existing conversation disappears from both lists. Blocking yourself is `422`.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      responses:
        '204': {description: The user is blocked.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Users]
      operationId: unblockUser
      summary: Unblock a user
      description: |
        **Authentication:** required. **Idempotent.** The two people become strangers again; a removed friendship is
        not restored.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      responses:
        '204': {description: The user is not blocked.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /me/blocks:
    get:
      tags: [Users]
      operationId: listBlockedUsers
      summary: People the caller blocked
      description: '**Authentication:** required. Most recently blocked first. Accounts that were deleted are left out.'
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockedUserPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /reports:
    post:
      tags: [Users]
      operationId: createReport
      summary: Report a post, a comment or a user
      description: |
        **Authentication:** required. The target must exist and be visible to the caller (else `404`); reporting
        yourself or your own content is `422`. **Idempotent:** reporting the same target again returns the existing
        report with `200` instead of creating another. Reports are stored for review by the operators; nothing is
        removed automatically. Limited to 20 per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateReportRequest'}
      responses:
        '200':
          description: This target was already reported by the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportEnvelope'}
        '201':
          description: Report stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /users/{user}/posts:
    get:
      tags: [Users]
      operationId: listUserPosts
      summary: Posts written by a user (Profile screen)
      description: |
        **Authentication:** required. **Authorization:** only posts the caller may see (see visibility model), so a
        stranger sees `public` posts, a friend sees `public` + `friends`, the author sees everything. Posts the caller
        has hidden from their feed are **included** (Profile ignores "hide", as it does today).

        **Order:** `createdAt` descending, then `id` descending.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of posts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /friend-requests:
    get:
      tags: [Friends]
      operationId: listFriendRequests
      summary: "[NEW] List pending friend requests"
      description: |
        **Authentication:** required. Lists pending requests only, newest first. The Flutter app has no screen for
        this yet; without it a request can never be accepted.
      parameters:
        - name: direction
          in: query
          description: '`incoming` = sent to me, `outgoing` = sent by me.'
          schema: {type: string, enum: [incoming, outgoing], default: incoming}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of pending requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Friends]
      operationId: sendFriendRequest
      summary: Send a friend request ("Thêm bạn")
      description: |
        **Authentication:** required. **Rate limit:** 60 per hour.

        **Validation:** `userId` must exist and must not be the caller (`422`).
        **Conflicts (`409`):** `already_friends`; `friend_request_exists` (the caller already sent one, or the other
        user already sent one to the caller; the client should reload `GET /users/{user}` to see which).
        Creates a `friend_request` notification for the receiver.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FriendRequestCreate'}
      responses:
        '201':
          description: Request created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequestEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /friend-requests/{friendRequest}/accept:
    post:
      tags: [Friends]
      operationId: acceptFriendRequest
      summary: "[NEW] Accept a friend request"
      description: |
        **Authentication:** required. **Authorization:** only the **receiver** of the request. Anyone else gets `404`.
        Turns the request into a friendship and creates a `friend_accepted` notification for the sender. The two
        people also start following each other (no `follow` notification; a follow that already exists is kept,
        and it stays when they stop being friends later).
        Returns the sender's profile with `friendship.status = friends`. Accepting an already accepted request is
        idempotent and returns the same profile.

        Note: the current Flutter "Đang chờ → Bạn bè" tap simulates acceptance locally; with the backend that tap
        can no longer make someone a friend.
      parameters:
        - {$ref: '#/components/parameters/FriendRequestId'}
      responses:
        '200':
          description: Now friends.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfileEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /friend-requests/{friendRequest}:
    delete:
      tags: [Friends]
      operationId: deleteFriendRequest
      summary: "[NEW] Cancel or decline a pending friend request"
      description: |
        **Authentication:** required. **Authorization:** the sender (cancel) or the receiver (decline). Deleting the row
        lets either person send a new request later (no "declined" state in v1). `404` if it does not exist, is not
        pending, or belongs to someone else.
      parameters:
        - {$ref: '#/components/parameters/FriendRequestId'}
      responses:
        '204': {description: Request removed.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /friends/{user}:
    delete:
      tags: [Friends]
      operationId: unfriend
      summary: "[NEW] Remove a friend"
      description: |
        **Authentication:** required. Idempotent: `204` even when the two users are not friends. `404` only when the
        user does not exist. After this the users no longer see each other's `friends`-only posts and stories.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      responses:
        '204': {description: They are not friends (any more).}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /feed:
    get:
      tags: [Feed]
      operationId: getFeed
      summary: Home feed
      description: |
        **Authentication:** required.

        **Contents:** the caller's own posts plus posts of accepted friends, limited to what the caller may see
        (own posts: any privacy; friends' posts: `public` and `friends`). Posts the caller **hid** are excluded.
        Strangers' posts do not appear here (they are found through Explore), so a brand-new account starts with an empty feed.

        **Search:** `q` filters the feed by post content or author name (Home search). Hidden posts never come back
        through search.

        **Followed people:** the public posts of people the caller follows (not friends) also appear. **Tabs (`filter`):** `all` (default) is the list above. `friends` keeps only the posts of accepted friends. `following` keeps only the posts of people the caller follows (explicit follows only: being friends does not count). `media` keeps only the posts that have at least one image or a `ready` video.
        `popular` keeps the last 7 days and sorts by likes (then `id`), like Explore's trending, but only over the
        posts of this feed. The cursor of one filter is rejected on another.

        **Order:** `createdAt` descending, then `id` descending (`popular`: `likes` descending, then `id`).
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - name: filter
          in: query
          schema: {type: string, enum: [all, friends, following, media, popular], default: all}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of posts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /explore:
    get:
      tags: [Feed]
      operationId: getExplore
      summary: Explore
      description: |
        **Authentication:** required.

        **Contents:** `public` posts from every user, including the caller. Posts the caller hid are **not** excluded
        (Explore ignores "hide" today); use `isHidden` if the client wants to dim them.

        **Filters** (`filter`, matching the three Explore chips):

        * `for_you` (default): newest first (`createdAt` desc, `id` desc).
        * `trending`: public posts from the last 7 days (server setting), most liked first (`likes` desc, then `id` desc).
          Counts can change between pages, so a post may repeat or be skipped; clients de-duplicate by `id`.
        * `short_video`: public posts whose video is `ready`, newest first.

        **Search:** `q` filters by content or author name and combines with `filter`.
      parameters:
        - name: filter
          in: query
          schema: {type: string, enum: [for_you, trending, short_video], default: for_you}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of posts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /posts:
    post:
      tags: [Posts]
      operationId: createPost
      summary: Create a post
      description: |
        **Authentication:** required. **Rate limit:** 30 per hour. Supports `Idempotency-Key`.

        `multipart/form-data` when images or a video are attached; `application/json` otherwise.

        **Validation** (mirrors `CreatePostScreen._submitPost`, plus server limits):
        * `content`: string, max 5000 characters, trimmed. May be empty **only** if an `image` or a `video` is present.
        * `images[]`: optional, 1-10 images (see Uploads), kept in the order sent. `image` (one file) is still accepted
          and means a list of one; sending both is `422` on `images`. More than 10 is `422`.
        * `video`: optional, one file (see Uploads). Not together with images (`422` on `video`). A file that is not a
          video, or is longer than 60 seconds, is `422` on `video`.
        * A post needs non-blank `content`, an image **or** a video; otherwise `422` on `content`.
        * `feeling`: optional, one of `cheerful`, `excited`, `happy`; `null` means no feeling.
        * `privacy`: optional, one of `public`, `friends`, `only_me`; default `public`.

        The author is always the caller. Counts start at 0. Nothing here changes the caller's feed order beyond
        the new post appearing first.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CreatePostRequest'}
            encoding:
              image: {contentType: 'image/jpeg, image/png, image/webp'}
              images: {contentType: 'image/jpeg, image/png, image/webp'}
          application/json:
            schema: {$ref: '#/components/schemas/CreatePostJsonRequest'}
            example: {content: Hello everyone, feeling: excited, privacy: public}
      responses:
        '201':
          description: Post created.
          headers:
            Location:
              description: URL of the new post.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /posts/{post}:
    get:
      tags: [Posts]
      operationId: getPost
      summary: Get one post
      description: |
        **Authentication:** required. **Authorization:** the post's visibility rule. A post the caller may not see
        is `404`. Used for deep links and notification targets. Hidden posts are returned (with `isHidden: true`).
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    patch:
      tags: [Posts]
      operationId: updatePostPrivacy
      summary: Change who can see a post
      description: |
        **Authentication:** required. **Authorization:** the author only (a visible post of someone else is `403`, a
        post the caller cannot see is `404`). Only `privacy` can be changed; the new value is effective at once for
        every endpoint (feed, Explore, profile, direct links). Notifications already sent stay, but opening one whose
        post the person can no longer see is a `404`. Setting the value it already has succeeds.
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privacy]
              properties:
                privacy: {$ref: '#/components/schemas/Privacy'}
      responses:
        '200':
          description: The updated post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Posts]
      operationId: deletePost
      summary: "[NEW] Delete a post"
      description: |
        **Authentication:** required. **Authorization:** the author only. A visible post that belongs to someone
        else is `403`; a post the caller cannot see is `404`. The post is soft-deleted immediately (it disappears from
        every endpoint) and its image file is removed by a queued job. Its likes, saves, hidden marks, comments and
        notifications go with it.
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '204': {description: Post deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /posts/{post}/like:
    put:
      tags: [Interactions]
      operationId: likePost
      summary: Like a post
      description: |
        **Authentication:** required. **Authorization:** the caller must be able to see the post (else `404`).
        **Idempotent:** liking twice keeps one like. The response is the **authoritative state**, so the client can
        replace its optimistic value. The optional JSON body `{"reaction": "love"}` chooses one of `like` (default),
        `love`, `haha`, `wow`, `sad`, `angry`: a new reaction on an already liked post replaces the old one and the
        count stays; without a body an existing reaction is kept. Creates a `like` notification for the author (not for self-likes; at most one
        per person and post, even if they like/unlike repeatedly).
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LikeRequest'}
      responses:
        '200':
          description: Current like state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LikeStateEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Interactions]
      operationId: unlikePost
      summary: Remove a like
      description: '**Authentication:** required. Idempotent: unliking a post that is not liked succeeds. Same authorization and response as `PUT`.'
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '200':
          description: Current like state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LikeStateEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /posts/{post}/save:
    put:
      tags: [Interactions]
      operationId: savePost
      summary: Save a post
      description: |
        **Authentication:** required. **Authorization:** the caller must be able to see the post (else `404`).
        Idempotent. Saved state is private to the caller. The saved posts are listed by `GET /me/saved-posts`.
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '200':
          description: Current save state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveStateEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Interactions]
      operationId: unsavePost
      summary: Unsave a post
      description: '**Authentication:** required. Idempotent. Same authorization and response as `PUT`.'
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '200':
          description: Current save state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaveStateEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /posts/{post}/hide:
    put:
      tags: [Interactions]
      operationId: hidePost
      summary: Hide a post from my feed
      description: |
        **Authentication:** required. **Authorization:** the caller must be able to see the post (else `404`).
        Idempotent. Only the caller's own `GET /feed` changes; the post is not deleted or hidden for anyone else,
        and it still appears in Explore and on profiles. This is the server side of the app's "Ẩn bài viết".
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '200':
          description: Current hidden state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HideStateEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    delete:
      tags: [Interactions]
      operationId: unhidePost
      summary: Undo hide ("Hoàn tác")
      description: '**Authentication:** required. Idempotent. Same authorization and response as `PUT`.'
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '200':
          description: Current hidden state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HideStateEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /posts/{post}/shares:
    post:
      tags: [Interactions]
      operationId: sharePost
      summary: "[NEW] Record that I shared a post"
      description: |
        **Authentication:** required. **Authorization:** the caller must be able to see the post (else `404`).
        The current app only opens a share sheet ("Sao chép liên kết", "Gửi trong tin nhắn") and never changes the
        count. This endpoint records the share so `shares` can be real. Each user counts **once per post**: repeating
        the call is idempotent and returns the same count. It does not create a repost or send the message itself
        (sending uses the conversations endpoints). Creates a `share` notification for the author (not for self-shares).
        May be deferred; until then `shares` is always `0`.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareRequest'}
      parameters:
        - {$ref: '#/components/parameters/PostId'}
      responses:
        '200':
          description: Current share count.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareStateEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /posts/{post}/comments:
    get:
      tags: [Comments]
      operationId: listComments
      summary: List comments of a post
      description: |
        **Authentication:** required. **Authorization:** whoever can see the post (else `404`).
        Flat list (no replies in v1). **Order:** `createdAt` descending, then `id` descending (newest first).
      parameters:
        - {$ref: '#/components/parameters/PostId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of comments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Comments]
      operationId: createComment
      summary: Add a comment
      description: |
        **Authentication:** required. **Rate limit:** 120 per hour. Supports `Idempotency-Key`.
        **Authorization:** whoever can see the post (else `404`).

        **Validation:** `content` required, 1-1000 characters after trimming.
        Creates a `comment` notification for the post author (not for self-comments).
        `meta.commentsCount` is the post's new comment count.
      parameters:
        - {$ref: '#/components/parameters/PostId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCommentRequest'}
            example: {content: Hay quá!}
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentCreatedEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /comments/{comment}:
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Delete a comment
      description: |
        **Authentication:** required. **Authorization:** the comment's author **or** the author of the post.
        Anyone else who can see the comment gets `403`; a comment on a post the caller cannot see is `404`.
      parameters:
        - {$ref: '#/components/parameters/CommentId'}
      responses:
        '204': {description: Comment deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /stories:
    get:
      tags: [Stories]
      operationId: listStories
      summary: Active stories (Home story row)
      description: |
        **Authentication:** required. Stories created less than 24 hours ago by the caller and the caller's accepted
        friends. The list is flat (one item per story, like today's `Story` model); it is **not** grouped by author.

        **Order:** the caller's own stories first (newest first), then everyone else's newest first
        (`createdAt` desc, `id` desc). The "Thêm tin" tile is a client-only tile and is not part of this list.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 30}
      responses:
        '200':
          description: A page of stories.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Stories]
      operationId: createStory
      summary: Create a story
      description: |
        **Authentication:** required. **Rate limit:** 30 per hour. Supports `Idempotency-Key`.
        `multipart/form-data` with an `image`, or `application/json` for a text story.

        **Validation:** `text` max 500 characters, trimmed; `background` one of `indigo`, `sunset`, `mint`, `berry`
        (default `indigo`); `image` optional (see Uploads). A story needs non-blank `text` **or** an `image`.
        `expiresAt` is set to `createdAt + 24 hours`.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CreateStoryRequest'}
            encoding:
              image: {contentType: 'image/jpeg, image/png, image/webp'}
          application/json:
            schema: {$ref: '#/components/schemas/CreateStoryJsonRequest'}
            example: {text: Tin của tôi, background: sunset}
      responses:
        '201':
          description: Story created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoryEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /stories/{story}/view:
    post:
      tags: [Stories]
      operationId: markStoryViewed
      summary: Mark a story as viewed
      description: |
        **Authentication:** required. **Authorization:** the caller must be able to see the story (else `404`).
        Idempotent. Viewing your own story does nothing. Makes `isViewed` true for the caller from then on.
        Call it once when the story viewer shows a story.
      parameters:
        - {$ref: '#/components/parameters/StoryId'}
      responses:
        '204': {description: Recorded.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: My conversations (Messages screen)
      description: |
        **Authentication:** required. Conversations the caller takes part in, with the other participant, the last
        message and the caller's unread count. A conversation that has no message yet is **not listed** (it still
        exists and can be opened with the id returned by `POST /conversations`).

        **Order:** last activity descending (`updatedAt` desc, then `id` desc).

        **Polling:** while the Messages screen is open, the client repeats this request every 15-30 seconds.
        There is no push or WebSocket in v1.

        **Search:** `q` keeps the conversations whose other participant's name or username contains the text
        (accent-insensitive, `%` and `_` are literal). The cursor of one query is rejected on another.
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of conversations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Conversations]
      operationId: startConversation
      summary: "[NEW] Start (or get) a direct conversation"
      description: |
        **Authentication:** required. **Authorization:** the target must be an accepted **friend** (`403`,
        `code: not_friends`). There is exactly one direct conversation per pair of users, so this returns
        the existing one (`200`) or creates it (`201`). Concurrent calls from both sides still yield one row.

        The Flutter app can currently only open seeded conversations; without this endpoint a real user could never
        start chatting.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversationRequest'}
      responses:
        '200':
          description: The conversation already existed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationEnvelope'}
        '201':
          description: The conversation was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /conversations/{conversation}/messages:
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: Messages of a conversation
      description: |
        **Authentication:** required. **Authorization:** participants only; anyone else gets `404`.

        Two mutually exclusive modes (sending both `cursor` and `after` is `422`):

        1. **History (default):** newest first (`createdAt` desc, `id` desc), paged with `cursor` ("load older").
           The Chat screen shows messages oldest-to-newest, so the client reverses each page.
        2. **Polling with `after`:** returns messages **newer** than the message with id `after`, oldest first, up to
           `limit`. `meta.nextCursor` is always `null`; if `hasMore` is `true` the client repeats the call with the id
           of the last message it received. Poll every 3-5 seconds while a chat is open, and de-duplicate by `id`
           (a message created at the same instant as another may arrive on the next poll). `after` of an unknown id is `404`.

        Both modes also return `meta.otherTyping` (boolean): the other participant sent `PUT .../typing` in the last
        6 seconds.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/Cursor'}
        - name: after
          in: query
          description: Id of the newest message the client already has (polling mode).
          schema: {$ref: '#/components/schemas/Id'}
        - {$ref: '#/components/parameters/MessageLimit'}
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Send a message
      description: |
        **Authentication:** required. **Rate limit:** 120 per minute. Supports `Idempotency-Key` (recommended: a
        retry after a timeout must not send the text twice). **Authorization:** participants only (else `404`).
        Sending is only allowed while the two users are still friends (`403`, `code: not_friends`).

        **Validation:** `text` is 0-2000 characters after trimming and may be empty **only** when the message has
        `attachments` (otherwise `422` on `text`). `attachments[]` holds up to 5 files, each max 10 MB: images (JPEG,
        PNG, WebP; re-encoded like post images) or documents (`pdf`, `doc`, `docx`, `xls`, `xlsx`, `ppt`, `pptx`,
        `txt`, `csv`, `zip`). Other types are `422` on `attachments.N`. With attachments the request is
        `multipart/form-data`. Sending also marks the conversation as read for the sender, updates `lastMessage` and `updatedAt`,
        and raises the other participant's `unreadCount`. Messages do not create notifications.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMessageRequest'}
            example: {text: Chào bạn!}
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CreateMessageMultipartRequest'}
      responses:
        '201':
          description: Message created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /conversations/{conversation}/read:
    post:
      tags: [Conversations]
      operationId: markConversationRead
      summary: Mark a conversation as read
      description: |
        **Authentication:** required. **Authorization:** participants only (else `404`).
        Sets the caller's read marker to the newest message that exists when the request is handled, or to
        `upToMessageId` when given (which must belong to this conversation). The marker never moves backwards.
        Idempotent. Call it when the Chat screen opens and when new messages arrive while it is open.
      parameters:
        - {$ref: '#/components/parameters/ConversationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MarkReadRequest'}
      responses:
        '204': {description: Marked as read.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: My notifications
      description: |
        **Authentication:** required. Only the caller's notifications, newest first (`createdAt` desc, then `id` desc).
        Notifications are created by queued jobs, so they can appear a few seconds after the action that caused them.
        Each item names the actor and the related ids; **the text and icon are composed by Flutter from `type`**
        (see the Notification type table). `relatedContent` is a short excerpt read at request time: the comment text for `comment`, the post text for
        `like` and `share`, and `null` for friend notifications (or when the post has no text).

        **Filters:** `category` = `interactions` (`like`, `comment`, `share`) or `friends` (`friend_request`,
        `friend_accepted`, `follow`); `unread=true` keeps only the unread ones. They combine. The cursor of one filter is
        rejected on another. Notifications from people who blocked, or are blocked by, the caller are never listed.
      parameters:
        - name: category
          in: query
          schema: {type: string, enum: [interactions, friends]}
        - name: unread
          in: query
          schema: {type: boolean}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadNotificationCount
      summary: "[NEW] Number of unread notifications (tab badge)"
      description: |
        **Authentication:** required. Lightweight request for the bottom-navigation badge. Poll every 30-60 seconds
        while the app is in the foreground. It is a separate endpoint (not part of the list `meta`) because the badge
        needs the total, not the size of one page.
      responses:
        '200':
          description: The unread count.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnreadCountEnvelope'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /notifications/read:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark every notification as read
      description: |
        **Authentication:** required. Idempotent. Matches the app's current behaviour where opening the Notifications
        tab marks everything read.
      responses:
        '204': {description: All notifications are read.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      description: |
        **Authentication:** required. **Authorization:** the recipient only; someone else's notification is `404`.
        Idempotent.
      parameters:
        - {$ref: '#/components/parameters/NotificationId'}
      responses:
        '204': {description: The notification is read.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/ServerError'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token from `register` or `login`.

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 1}

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `meta.nextCursor`. Omit for the first page.
      schema: {type: string, maxLength: 512}
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    MessageLimit:
      name: limit
      in: query
      description: Page size for messages.
      schema: {type: integer, minimum: 1, maximum: 100, default: 30}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID. Repeating the same request with the same key within 24 hours returns the original response.
      schema: {type: string, format: uuid}
    UserId:
      name: user
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    PostId:
      name: post
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    CommentId:
      name: comment
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    StoryId:
      name: story
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ConversationId:
      name: conversation
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    NotificationId:
      name: notification
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    FriendRequestId:
      name: friendRequest
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}

  responses:
    BadRequest:
      description: Malformed request, or a cursor that does not match this endpoint or its filters.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: The cursor is not valid for this request., code: invalid_cursor}
    Unauthenticated:
      description: Missing, invalid, expired or revoked token. The client deletes its stored token and shows the login screen.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: Unauthenticated., code: unauthenticated}
    Forbidden:
      description: The resource is visible to the caller but the action is not allowed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: This action is unauthorized., code: forbidden}
    NotFound:
      description: The resource does not exist, or the caller is not allowed to know it exists.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: Not found., code: not_found}
    Conflict:
      description: The request is valid but conflicts with the current state (or reuses an Idempotency-Key with a different body).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: A friend request already exists., code: friend_request_exists}
    PayloadTooLarge:
      description: The uploaded file is larger than the server accepts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: The uploaded file is too large., code: payload_too_large}
    ValidationFailed:
      description: Validation failed. `errors` maps each field to its messages.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
          example: {message: Validation failed., code: validation_failed, errors: {content: [The content field is required.]}}
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: Too many requests., code: too_many_requests}
    ServerError:
      description: Unexpected error. The body never contains exception details in production.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: Server error., code: server_error}

  schemas:
    # ------------------------------------------------------------------ basics
    Id:
      type: string
      description: 26-character lowercase ULID. Opaque to clients.
      minLength: 26
      maxLength: 26
      pattern: '^[0-9a-hjkmnp-tv-z]{26}$'
      example: 01j8z6t4q9v3x7y2n5m1k8r0pd
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC, second precision.
      example: '2026-09-30T08:15:00Z'
    Error:
      type: object
      required: [message, code]
      properties:
        message: {type: string, description: English developer text. Not for display.}
        code: {type: string, description: Stable machine-readable code.}
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Field name to list of messages. Multipart/JSON field names as sent.
              additionalProperties:
                type: array
                items: {type: string}
    CursorMeta:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` to get the next page. `null` when `hasMore` is false.
        hasMore: {type: boolean}

    # ------------------------------------------------------------------- enums
    Privacy:
      type: string
      enum: [public, friends, only_me]
      description: 'Flutter `Post.privacy` (was the Vietnamese label). Labels: Công khai / Bạn bè / Chỉ mình tôi.'
    Feeling:
      type: string
      enum: [cheerful, excited, happy]
      description: |
        The three feelings that exist in `CreatePostScreen` today (no new ones): `cheerful` = "Cảm thấy vui",
        `excited` = "Hứng thú", `happy` = "Hạnh phúc".
    StoryBackground:
      type: string
      enum: [indigo, sunset, mint, berry]
      description: The four background presets of `StoryCreatorScreen`, by index 0-3. Replaces `Story.gradientColors`.
    NotificationType:
      type: string
      enum: [like, comment, share, friend_request, friend_accepted, follow]
      description: '`friend_request` was `friend` in the mock data. `friend_accepted` and `follow` are new.'
    FriendshipStatus:
      type: string
      enum: [none, pending_outgoing, pending_incoming, friends, self]
      description: |
        Relationship of the caller to a user. Replaces the Friends screen's private `_FriendStatus {add, pending, friends}`:
        `none` = Thêm bạn, `pending_outgoing` = Đang chờ, `friends` = Bạn bè; `pending_incoming` and `self` are new.
    OtherFriendshipStatus:
      type: string
      enum: [none, pending_outgoing, pending_incoming, friends]
    Friendship:
      type: object
      required: [status, requestId]
      properties:
        status: {$ref: '#/components/schemas/FriendshipStatus'}
        requestId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
          description: Id of the pending request when status is `pending_outgoing` or `pending_incoming`, otherwise `null`.

    # ------------------------------------------------------------------- users
    UserSummary:
      type: object
      description: The small user object embedded in posts, comments, stories, messages and notifications.
      x-flutter-source: UserModel (lib/models/user.dart)
      x-backend-entity: users
      x-not-exposed:
        - "coverUrl (seed only, no UI)"
        - "accentColor (UI only)"
        - "isFriend (replaced by friendship)"
        - "mutualFriends (moved to UserListItem / UserProfile)"
      required: [id, name, username, avatarUrl]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 2, maxLength: 50}
        username:
          type: string
          pattern: '^[a-z0-9_]{3,30}$'
          description: Without the leading `@` (the mock data stores `@minh_anh`; Flutter adds the `@` when displaying).
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: '`null` when the user has no avatar; Flutter shows its person-icon fallback.'
    UserListItem:
      description: A user in search results, with the caller's relationship to them.
      x-flutter-source: UserModel as used by FriendsScreen
      x-backend-entity: users + friendships
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [mutualFriendsCount, friendship, isFollowing, isOnline, lastSeenAt]
          properties:
            isFollowing: {type: boolean}
            isOnline: {$ref: '#/components/schemas/IsOnline'}
            lastSeenAt: {$ref: '#/components/schemas/LastSeenAt'}
            mutualFriendsCount:
              type: integer
              minimum: 0
              x-computed: friends the caller and this user have in common
            friendship: {$ref: '#/components/schemas/Friendship'}
    UserProfile:
      description: A full public profile.
      x-flutter-source: UserModel as used by ProfileScreen
      x-backend-entity: users + friendships
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [bio, coverUrl, about, createdAt, note, hasStories, friendsCount, followersCount, followingCount, isFollowing, followsYou, isOnline, lastSeenAt, mutualFriendsCount, friendship, isBlocked]
          properties:
            note:
              anyOf:
                - $ref: '#/components/schemas/Note'
                - type: 'null'
              description: The active note of the profile owner, if the caller may see it (`public`, or `friends` for a friend; the owner always sees their own).
            hasStories: {type: boolean, x-computed: 'the user has an unexpired story the caller may see (open them with GET /users/{user}/stories)'}
            followersCount: {type: integer, minimum: 0}
            followingCount: {type: integer, minimum: 0}
            isFollowing: {type: boolean, x-computed: the caller follows this user}
            followsYou: {type: boolean, x-computed: this user follows the caller}
            isOnline: {$ref: '#/components/schemas/IsOnline'}
            lastSeenAt: {$ref: '#/components/schemas/LastSeenAt'}
            coverUrl: {type: [string, 'null'], format: uri, description: 'The profile header image.'}
            about: {$ref: '#/components/schemas/About'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
            isBlocked: {type: boolean, x-computed: 'a row in user_blocks from the caller to this user'}
            bio: {type: [string, 'null'], maxLength: 300, description: '`null` when empty (Flutter shows an empty bio).'}
            friendsCount:
              type: integer
              minimum: 0
              x-computed: accepted friendships of this user
              description: The number ProfileScreen shows as "N bạn bè". (The mock model reused `mutualFriends` for this.)
            mutualFriendsCount:
              type: [integer, 'null']
              minimum: 0
              x-computed: '`null` when the profile is the caller''s own'
            friendship: {$ref: '#/components/schemas/Friendship'}
    Me:
      description: The authenticated user's own account, including private fields.
      x-flutter-source: currentUser / UserModel
      x-backend-entity: users
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          required: [email, emailVerified, bio, coverUrl, about, showOnlineStatus, friendsCount, followersCount, followingCount, createdAt]
          properties:
            showOnlineStatus: {type: boolean}
            followersCount: {type: integer, minimum: 0}
            followingCount: {type: integer, minimum: 0}
            coverUrl: {type: [string, 'null'], format: uri}
            about: {$ref: '#/components/schemas/About'}
            email: {type: string, format: email}
            emailVerified: {type: boolean, x-computed: email_verified_at is not null}
            bio: {type: [string, 'null'], maxLength: 300}
            friendsCount: {type: integer, minimum: 0, x-computed: accepted friendships}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    AuthToken:
      type: object
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken: {type: string, description: Plain-text Sanctum token. Shown only in this response.}
        tokenType: {type: string, const: Bearer}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    AuthResult:
      type: object
      required: [user, token]
      properties:
        user: {$ref: '#/components/schemas/Me'}
        token: {$ref: '#/components/schemas/AuthToken'}
    RegisterRequest:
      type: object
      required: [name, username, email, password]
      properties:
        name: {type: string, minLength: 2, maxLength: 50}
        username: {type: string, pattern: '^[a-z0-9_]{3,30}$'}
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, format: password, minLength: 8, maxLength: 72}
        deviceName: {type: string, maxLength: 60}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        deviceName: {type: string, maxLength: 60}
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$'}
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    ResetPasswordRequest:
      type: object
      required: [email, code, password]
      properties:
        email: {type: string, format: email}
        code: {type: string, pattern: '^[0-9]{6}$'}
        password: {type: string, format: password, minLength: 8, maxLength: 72}
    DeviceRequest:
      type: object
      required: [token, platform]
      properties:
        token: {type: string, maxLength: 512, description: "FCM registration token"}
        platform: {type: string, enum: [ios, android]}
      additionalProperties: false

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: {type: string, format: password}
    UpdateMeRequest:
      type: object
      description: Send only the fields to change. A blank text or `null` clears a field.
      properties:
        name: {type: string, minLength: 2, maxLength: 50}
        bio: {type: [string, 'null'], maxLength: 300}
        showOnlineStatus: {type: boolean, description: 'Let friends see when you are online and when you were last active. Default true.'}
        location: {type: [string, 'null'], maxLength: 100}
        hometown: {type: [string, 'null'], maxLength: 100}
        workplace: {type: [string, 'null'], maxLength: 100}
        education: {type: [string, 'null'], maxLength: 100}
        website: {type: [string, 'null'], maxLength: 200, description: 'An http:// or https:// address.'}
        birthday: {type: [string, 'null'], format: date, description: 'YYYY-MM-DD, after 1900-01-01 and before today.'}
    Note:
      type: object
      required: [user, text, track, privacy, createdAt, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/UserSummary'}
        privacy: {$ref: '#/components/schemas/Privacy'}
        text: {type: string, maxLength: 60, description: 'Empty when the note is only a song.'}
        track:
          anyOf:
            - $ref: '#/components/schemas/Track'
            - type: 'null'
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    NoteEnvelope: {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/Note'}}}
    NoteList: {type: object, required: [data], properties: {data: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Note'}}}}
    SetNoteRequest:
      type: object
      properties:
        text: {type: string, maxLength: 60, description: 'Required (1-60) unless `trackId` is given.'}
        trackId: {type: string, maxLength: 20}
        privacy: {$ref: '#/components/schemas/Privacy'}
    Track:
      type: object
      description: A song with a 30-second preview, from Apple Music.
      required: [id, title, artist, artworkUrl, previewUrl, appleMusicUrl, spotifyUrl]
      properties:
        id: {type: string, description: 'The Apple Music / iTunes track id.'}
        title: {type: string}
        artist: {type: string}
        artworkUrl: {type: [string, 'null'], format: uri}
        previewUrl: {type: string, format: uri, description: '30-second preview (https, hosted by Apple).'}
        appleMusicUrl: {type: [string, 'null'], format: uri}
        spotifyUrl: {type: [string, 'null'], format: uri, description: 'The same song on Spotify; only on notes and stories, and only when Spotify is configured on the server.'}
    TrackList: {type: object, required: [data], properties: {data: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Track'}}}}
    IsOnline:
      type: boolean
      description: |
        True when the user was active in the last 2 minutes. Only friends see it, and only when the user has not turned
        "show online status" off; otherwise it is `false` (the same as offline, so it does not reveal the setting).
    LastSeenAt:
      anyOf:
        - $ref: '#/components/schemas/Timestamp'
        - type: 'null'
      description: When the user was last active. `null` when it is hidden (same rule as `isOnline`) or unknown.
    About:
      type: object
      description: The "About" tab. Every field can be `null`.
      required: [location, hometown, workplace, education, website, birthday]
      properties:
        location: {type: [string, 'null'], maxLength: 100}
        hometown: {type: [string, 'null'], maxLength: 100}
        workplace: {type: [string, 'null'], maxLength: 100}
        education: {type: [string, 'null'], maxLength: 100}
