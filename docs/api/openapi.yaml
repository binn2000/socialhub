# ===========================================================================
# Database proposal (MariaDB 10.1.38, the version in this machine's local
# XAMPP install). Not part of the HTTP contract; it documents the schema the
# API above is designed against so that both stay in step.
# ===========================================================================
x-database:
  engine: "MariaDB 10.1.38 (InnoDB; bundled with the project's local XAMPP install). This is an old, unsupported release (MariaDB 10.1 reached end-of-life in October 2020); it is accepted here only because it is what the development machine already has, and three real limitations follow from it (see conventions below). Moving to a maintained MariaDB (10.6+ LTS) or MySQL 8 later only requires reverting these three notes, not a schema redesign."
  charset: "utf8mb4, collation utf8mb4_unicode_ci. MariaDB has no `utf8mb4_0900_ai_ci` (that collation is MySQL-8-only); `utf8mb4_unicode_ci` folds most accents at the primary sorting level (`minh` still matches `Mình`), but is not guaranteed for every stacked Vietnamese diacritic (e.g. `ệ`), so verify the specific search cases the app relies on once the real data is in."
  conventions:
    - "Primary keys are `char(26)` lowercase ULIDs generated by the application (Eloquent `HasUlids`). Exceptions: pure link tables use a composite primary key; `personal_access_tokens`, `idempotency_keys` and the queue tables keep their own key."
    - "Because users use ULIDs, Sanctum's migration must use `ulidMorphs('tokenable')` (the default `morphs()` would create a bigint column)."
    - "Enum-like columns (`privacy`, `feeling`, `background`, `status`, `type`) are `varchar` validated by PHP backed enums, not MySQL/MariaDB ENUM, so adding a value needs no ALTER TABLE."
    - "Timestamps are UTC `timestamp` columns (Laravel default); the API prints them as RFC 3339 with `Z`."
    - "Every foreign key is declared. Cascade rules are listed per table."
    - "Soft deletes only on `users`, `posts`, `comments` (moderation and undo). Every list query must exclude soft-deleted rows."
    - "Counters (`likes_count`, `comments_count`, `shares_count`) are denormalized for cheap reads and are updated in the same transaction as the row that causes the change."
    - "Files live on a Laravel disk (`local`/`public` in development, S3-compatible in production); tables store only relative paths (`*_path`). The API turns a path into an absolute URL."
    - "MariaDB 10.1 limitation 1 — long utf8mb4 unique indexes: InnoDB's default key-prefix limit is 767 bytes, and `varchar(255)` in utf8mb4 needs up to 1020. 10.1 can go past that, but only with `innodb_large_prefix=1`, `innodb_file_format=Barracuda` (both in `my.cnf`) and `ROW_FORMAT=DYNAMIC` on the affected tables. The migrations for `users` (email/username) and `conversations` (direct_key) must set `ROW_FORMAT=DYNAMIC` explicitly; without the two server settings the migration fails with 'Specified key was too long'."
    - "MariaDB 10.1 limitation 2 — CHECK constraints are parsed but not enforced (enforcement starts at MariaDB 10.2.1). Every `checks:` entry below is therefore documentation only; the same rule must also be enforced in a Laravel Form Request or model validation, or bad rows can reach the database."
    - "MariaDB 10.1 limitation 3 — no native JSON type (it exists as a `LONGTEXT` alias with no validation). `idempotency_keys.response_body` is declared `text` here, not `json`, and the app must `json_encode`/`json_decode` it itself; Eloquent's automatic JSON casting still works against a text column."

  tables:
    users:
      apiEntities: [UserSummary, UserListItem, UserProfile, Me]
      flutterSource: UserModel
      softDeletes: true
      rowFormat: "DYNAMIC (needed for the utf8mb4 unique indexes below under MariaDB 10.1; see x-database.conventions)"
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary}
        - {name: name, type: "varchar(50)", nullable: false}
        - {name: username, type: "varchar(30)", nullable: false, note: "stored without '@'"}
        - {name: email, type: "varchar(255)", nullable: false}
        - {name: email_verified_at, type: timestamp, nullable: true, note: "set when the emailed code is confirmed (`POST /auth/email/verify`)"}
        - {name: password, type: "varchar(255)", nullable: false, note: "hashed by Laravel; never returned"}
        - {name: avatar_path, type: "varchar(255)", nullable: true}
        - {name: bio, type: "varchar(300)", nullable: true}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
        - {name: deleted_at, type: timestamp, nullable: true}
      unique: ["username", "email"]
      indexes:
        - {columns: [name, id], note: "orders /users; `LIKE '%q%'` cannot use it, so search scans (fine for v1; move to FULLTEXT ngram if it becomes slow)"}
      notes:
        - "Not stored: `coverUrl`, `accentColor` (no UI), `isFriend`, `mutualFriends`, `friendsCount` (computed from friendships)."
        - "Account deletion (soft delete, then a purge job that hard-deletes and lets the cascades run) needs a retention decision."

    personal_access_tokens:
      apiEntities: [AuthToken]
      note: "Sanctum's table, adapted for ULID owners."
      rowFormat: "DYNAMIC (the (tokenable_type, tokenable_id) index spans a varchar(255) utf8mb4 column, which exceeds 767 bytes under MariaDB 10.1; found when running the schema)"
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: tokenable_type, type: "varchar(255)", nullable: false}
        - {name: tokenable_id, type: "char(26)", nullable: false}
        - {name: name, type: "varchar(255)", nullable: false, note: "device name from the request"}
        - {name: token, type: "char(64)", nullable: false, note: "SHA-256 hash; the plain token is shown once"}
        - {name: abilities, type: text, nullable: true}
        - {name: last_used_at, type: timestamp, nullable: true}
        - {name: expires_at, type: timestamp, nullable: true, note: "set to now + 30 days when the token is created"}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
      unique: ["token"]
      indexes:
        - {columns: [tokenable_type, tokenable_id]}
        - {columns: [expires_at], note: "for `sanctum:prune-expired`"}
      notes:
        - "No foreign key is possible on a polymorphic column, so deleting a user must delete their tokens explicitly (a `deleting` hook or the purge job)."

    friendships:
      apiEntities: [Friendship, FriendRequest]
      flutterSource: "none (the mock app only had UserModel.isFriend and a local _FriendStatus enum)"
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary, note: "this is the `friendRequestId` while status is pending"}
        - {name: requester_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: addressee_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: user_low_id, type: "char(26)", nullable: false, note: "min(requester_id, addressee_id), set by the app (Friendship::creating). Not a generated column: MariaDB 10.2+ rejects LEAST() on strings there (error 1901)"}
        - {name: user_high_id, type: "char(26)", nullable: false, note: "max(requester_id, addressee_id), set by the app"}
        - {name: status, type: "varchar(10)", nullable: false, note: "pending | accepted"}
        - {name: accepted_at, type: timestamp, nullable: true}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
      unique:
        - "(user_low_id, user_high_id): exactly one row per pair of users whichever way the request went. This makes A-to-B and B-to-A sent at the same moment impossible: the second INSERT fails with error 1062."
      checks:
        - "requester_id <> addressee_id (not enforced by MariaDB 10.1 — also validate in the service that creates a friend request)"
      indexes:
        - {columns: [addressee_id, status, created_at], note: "incoming requests"}
        - {columns: [requester_id, status, created_at], note: "outgoing requests"}
        - {columns: [user_low_id, status], note: "friend lookup (one side)"}
        - {columns: [user_high_id, status], note: "friend lookup (other side)"}
      notes:
        - "Cancel, decline and unfriend all delete the row (no `declined` state in v1; a declined user can be asked again, so there is no anti-harassment protection yet)."
        - "Send: INSERT; on duplicate key read the row and answer 409 `already_friends` or `friend_request_exists`."
        - "Accept: `UPDATE ... SET status='accepted' WHERE id=? AND addressee_id=? AND status='pending'`; 0 rows means either already accepted (return success) or not allowed (404)."

    posts:
      apiEntities: [Post]
      flutterSource: Post
      softDeletes: true
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: content, type: text, nullable: true, note: "API prints null as empty string"}
        - {name: image_path, type: "varchar(255)", nullable: true}
        - {name: video_status, type: "varchar(12)", nullable: true, note: "processing | ready | failed; null without a video"}
        - {name: video_source_path, type: "varchar(255)", nullable: true, note: "the upload as sent, kept until the queue job has converted it"}
        - {name: video_path, type: "varchar(255)", nullable: true}
        - {name: video_thumb_path, type: "varchar(255)", nullable: true}
        - {name: video_duration, type: "smallint unsigned", nullable: true, note: "seconds"}
        - {name: video_width, type: "smallint unsigned", nullable: true}
        - {name: video_height, type: "smallint unsigned", nullable: true}
        - {name: feeling, type: "varchar(20)", nullable: true, note: "cheerful | excited | happy"}
        - {name: privacy, type: "varchar(10)", nullable: false, default: public, note: "public | friends | only_me"}
        - {name: likes_count, type: "int unsigned", nullable: false, default: 0}
        - {name: comments_count, type: "int unsigned", nullable: false, default: 0}
        - {name: shares_count, type: "int unsigned", nullable: false, default: 0}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
        - {name: deleted_at, type: timestamp, nullable: true}
      checks:
        - "content IS NOT NULL OR image_path IS NOT NULL OR video_status IS NOT NULL (not enforced by MariaDB 10.1; blank-after-trim content is rejected by validation anyway, which is where this must actually be checked)"
      indexes:
        - {columns: [user_id, created_at, id], note: "profile posts and the friends part of the feed"}
        - {columns: [privacy, created_at, id], note: "Explore `for_you` and the 7-day window of `trending`"}
      notes:
        - "Not stored: `imageId` (mock only), `isLiked`, `isSaved`, `isHidden` (per-viewer, computed from the link tables)."
        - "The feed is built on read: posts where user_id is the caller or an accepted friend, privacy allowed, not hidden by the caller. That is fine for v1; a fan-out table would only be needed at much larger scale."

    post_likes:
      flutterSource: "Post.isLiked / Post.likes"
      columns:
        - {name: post_id, type: "char(26)", nullable: false, references: posts.id, onDelete: cascade}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: reaction, type: "varchar(8)", nullable: false, default: like, note: "like | love | haha | wow | sad | angry"}
        - {name: created_at, type: timestamp, nullable: true}
      primaryKey: [post_id, user_id]
      notes:
        - "The composite primary key IS the unique constraint on user + post. Like = `INSERT IGNORE`; increment `posts.likes_count` only if 1 row was inserted. Unlike = `DELETE`; decrement (`GREATEST(x-1, 0)`) only if 1 row was deleted. Both in one transaction, so double taps and concurrent requests cannot double count."
        - "A nightly job may recompute the counters from the link tables to repair drift."

    post_saves:
      flutterSource: "MainScreen._savedPostIds"
      columns:
        - {name: post_id, type: "char(26)", nullable: false, references: posts.id, onDelete: cascade}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: created_at, type: timestamp, nullable: true}
      primaryKey: [post_id, user_id]
      indexes:
        - {columns: [user_id, created_at, post_id], note: "the saved posts list (`GET /me/saved-posts`)"}
      notes:
        - "Unique user + post through the primary key. Idempotent `INSERT IGNORE` / `DELETE`; no counter."

    post_hidden:
      flutterSource: "MainScreen._hiddenPostIds"
      columns:
        - {name: post_id, type: "char(26)", nullable: false, references: posts.id, onDelete: cascade}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: created_at, type: timestamp, nullable: true}
      primaryKey: [post_id, user_id]
      notes:
        - "Unique user + post through the primary key. The feed excludes rows with a match (`NOT EXISTS`, a primary-key lookup)."

    post_shares:
      flutterSource: "Post.shares (the mock app never changed it)"
      columns:
        - {name: post_id, type: "char(26)", nullable: false, references: posts.id, onDelete: cascade}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: target, type: "varchar(10)", nullable: false, note: "link | message"}
        - {name: created_at, type: timestamp, nullable: true}
      primaryKey: [post_id, user_id]
      notes:
        - "One row per user and post, so `shares` counts distinct people. Same insert-then-increment rule as likes."

    comments:
      apiEntities: [Comment]
      flutterSource: "none (mock app had Post.comments as a number only)"
      softDeletes: true
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary}
        - {name: post_id, type: "char(26)", nullable: false, references: posts.id, onDelete: cascade}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: content, type: "varchar(1000)", nullable: false}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
        - {name: deleted_at, type: timestamp, nullable: true}
      indexes:
        - {columns: [post_id, created_at, id], note: "comment pages of a post"}
      notes:
        - "Create/delete adjusts `posts.comments_count` in the same transaction."

    stories:
      apiEntities: [Story]
      flutterSource: Story
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: text, type: "varchar(500)", nullable: true}
        - {name: image_path, type: "varchar(255)", nullable: true}
        - {name: background, type: "varchar(10)", nullable: false, default: indigo, note: "indigo | sunset | mint | berry"}
        - {name: expires_at, type: timestamp, nullable: false, note: "created_at + 24 hours"}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
      checks:
        - "text IS NOT NULL OR image_path IS NOT NULL (not enforced by MariaDB 10.1; validate in the request)"
      indexes:
        - {columns: [user_id, created_at, id], note: "stories of the caller and friends, newest first (`expires_at > now()` is a filter)"}
        - {columns: [expires_at], note: "scheduled purge of expired stories and their files"}
      notes:
        - "Not stored: `gradientColors` (UI) and `isViewed` (per-viewer, from story_views)."

    story_views:
      flutterSource: "Story.isViewed (seed only in the mock app)"
      columns:
        - {name: story_id, type: "char(26)", nullable: false, references: stories.id, onDelete: cascade}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: viewed_at, type: timestamp, nullable: false}
      primaryKey: [story_id, user_id]
      indexes:
        - {columns: [user_id, story_id], note: "'which of these stories have I viewed' looks up by user first"}
      notes:
        - "Unique story + user through the primary key; `INSERT IGNORE` makes repeated views harmless. The author's own views are not recorded."

    conversations:
      apiEntities: [Conversation]
      flutterSource: Conversation
      rowFormat: "DYNAMIC (needed for the direct_key unique index under MariaDB 10.1; see x-database.conventions)"
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary}
        - {name: type, type: "varchar(10)", nullable: false, default: direct, note: "only 'direct' in v1"}
        - {name: direct_key, type: "char(53)", nullable: true, note: "'{lowerUserId}:{higherUserId}' for direct conversations"}
        - {name: last_message_id, type: "char(26)", nullable: true, references: messages.id, onDelete: "set null", note: "foreign key added in a later migration because messages references conversations"}
        - {name: last_message_at, type: "timestamp(3)", nullable: true}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
      unique: ["direct_key"]
      indexes:
        - {columns: [last_message_at, id], note: "Messages screen order"}
      notes:
        - "`direct_key` unique means two users can have at most one direct conversation; if both open it at once the second INSERT fails and the code reads the existing row."
        - "API `updatedAt` = `last_message_at` or, when there is no message, `created_at`."

    conversation_participants:
      flutterSource: "Conversation.user (the other participant) and Conversation.unreadCount"
      columns:
        - {name: conversation_id, type: "char(26)", nullable: false, references: conversations.id, onDelete: cascade}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: last_read_message_id, type: "char(26)", nullable: true, references: messages.id, onDelete: "set null", note: "read marker; NULL means nothing read yet"}
        - {name: created_at, type: timestamp, nullable: true}
      primaryKey: [conversation_id, user_id]
      indexes:
        - {columns: [user_id, conversation_id], note: "list my conversations"}
      notes:
        - "Unique conversation + user through the primary key."
        - "Moving the marker is monotonic: `UPDATE ... SET last_read_message_id=? WHERE conversation_id=? AND user_id=? AND (last_read_message_id IS NULL OR last_read_message_id < ?)`, so a late request cannot mark messages unread again."
        - "`unreadCount` = messages sent by the other user that are newer than the marker; computed, never stored."

    messages:
      apiEntities: [Message]
      flutterSource: ChatMessage
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary}
        - {name: conversation_id, type: "char(26)", nullable: false, references: conversations.id, onDelete: cascade}
        - {name: sender_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: text, type: "varchar(2000)", nullable: false}
        - {name: created_at, type: "timestamp(3)", nullable: false, note: "millisecond precision so ordering matches the ULID"}
      indexes:
        - {columns: [conversation_id, created_at, id], note: "history pages and polling with `after`"}
        - {columns: [sender_id]}
      notes:
        - "Messages are immutable (no updated_at, no soft delete). `sender_id` cascades, so hard-deleting a user erases their messages for the other person too; decide the account-deletion policy before launch."
        - "Sending runs in one transaction: insert the message, set `conversations.last_message_*`, and move the sender's read marker to the new message."

    notifications:
      apiEntities: [Notification]
      flutterSource: SocialNotification
      note: "A custom table, not Laravel's built-in `notifications` (which stores a JSON payload and cannot have foreign keys, so deleted posts would leave dangling references)."
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade, note: recipient}
        - {name: actor_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: type, type: "varchar(20)", nullable: false, note: "like | comment | share | friend_request | friend_accepted"}
        - {name: post_id, type: "char(26)", nullable: true, references: posts.id, onDelete: cascade}
        - {name: comment_id, type: "char(26)", nullable: true, references: comments.id, onDelete: cascade}
        - {name: friendship_id, type: "char(26)", nullable: true, references: friendships.id, onDelete: cascade}
        - {name: dedupe_key, type: "varchar(120)", nullable: true, note: "e.g. 'like:{actorId}:{postId}'; NULL for comments"}
        - {name: read_at, type: timestamp, nullable: true}
        - {name: created_at, type: timestamp, nullable: true}
      unique: ["dedupe_key"]
      checks:
        - "user_id <> actor_id (no self-notifications; not enforced by MariaDB 10.1 — the job that creates notifications must skip this case itself)"
      indexes:
        - {columns: [user_id, created_at, id], note: "the list"}
        - {columns: [user_id, read_at], note: "unread count"}
      notes:
        - "Created by queued jobs (database queue driver), so they are eventually consistent."
        - "`dedupe_key` unique stops like / unlike / like from creating several notifications; the insert uses `INSERT IGNORE`. Comments have no key, so every comment notifies."
        - "`relatedContent` is read from the post or comment when the list is requested, not stored."
        - "Foreign keys only fire on hard delete. Soft-deleting a post or comment must also delete its notifications (in the same job), or the list query must join and skip soft-deleted targets."
        - "`isRead` = read_at IS NOT NULL. `friendRequestId` is friendship_id while that friendship is still pending."

    idempotency_keys:
      note: "Supporting table for the `Idempotency-Key` header. Delete rows older than 24 hours with a scheduled job."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: key, type: "char(36)", nullable: false}
        - {name: method, type: "varchar(6)", nullable: false}
        - {name: path, type: "varchar(255)", nullable: false}
        - {name: request_hash, type: "char(64)", nullable: false, note: "SHA-256 of the request body; a different body under the same key is 409"}
        - {name: status_code, type: "smallint unsigned", nullable: true, note: "NULL while the first request is still running"}
        - {name: response_body, type: text, nullable: true, note: "JSON-encoded by the app; MariaDB 10.1 has no native JSON type (see x-database.conventions)"}
        - {name: created_at, type: timestamp, nullable: false}
      unique: ["(user_id, key)"]
      indexes:
        - {columns: [created_at], note: "purge"}
      notes:
        - "The first request inserts the row before doing the work. A concurrent duplicate hits the unique key and gets 409 while the original is still running."

    device_tokens:
      apiEntities: []
      note: "Push (FCM) registration tokens of the users' phones."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: token_hash, type: "char(64)", nullable: false, note: "SHA-256 of the token; the unique index is on this because tokens are long"}
        - {name: token, type: "varchar(512)", nullable: false}
        - {name: platform, type: "varchar(10)", nullable: false, note: "ios | android"}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
      unique: ["(token_hash)"]
      notes:
        - "A token seen again for another account is moved to that account. Tokens FCM reports as gone are deleted."

    users_profile_columns:
      apiEntities: []
      note: "Columns added to `users` for the profile (migration add_profile_fields_to_users). Listed here because the users table above predates them."
      columns:
        - {name: cover_path, type: "varchar(255)", nullable: true, note: "relative path on the images disk"}
        - {name: location, type: "varchar(100)", nullable: true}
        - {name: hometown, type: "varchar(100)", nullable: true}
        - {name: workplace, type: "varchar(100)", nullable: true}
        - {name: education, type: "varchar(100)", nullable: true}
        - {name: website, type: "varchar(200)", nullable: true}
        - {name: birthday, type: date, nullable: true}
        - {name: last_seen_at, type: timestamp, nullable: true, note: "refreshed by authenticated requests, at most once a minute"}
        - {name: show_online_status, type: boolean, nullable: false, note: "default true"}

    post_images:
      apiEntities: []
      note: "The images of a post, in display order. posts.image_path stays equal to the first one."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: post_id, type: "char(26)", nullable: false, references: posts.id, onDelete: cascade}
        - {name: path, type: "varchar(255)", nullable: false}
        - {name: position, type: "tinyint unsigned", nullable: false, note: "0-based"}
        - {name: created_at, type: timestamp, nullable: true}
      indexes:
        - {columns: [post_id, position]}

    message_attachments:
      apiEntities: []
      note: "Images and documents sent in a chat message."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: message_id, type: "char(26)", nullable: false, references: messages.id, onDelete: cascade}
        - {name: type, type: "varchar(10)", nullable: false, note: "image | file"}
        - {name: path, type: "varchar(255)", nullable: false}
        - {name: name, type: "varchar(255)", nullable: false}
        - {name: mime_type, type: "varchar(100)", nullable: false}
        - {name: size_bytes, type: "int unsigned", nullable: false}
        - {name: width, type: "smallint unsigned", nullable: true}
        - {name: height, type: "smallint unsigned", nullable: true}
        - {name: created_at, type: timestamp, nullable: true}
      indexes:
        - {columns: [message_id]}

    follows:
      apiEntities: []
      note: "One-way follows (PUT /users/{user}/follow)."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: follower_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: followee_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: created_at, type: timestamp, nullable: true}
      unique: ["(follower_id, followee_id)"]
      indexes:
        - {columns: [followee_id]}

    notes:
      apiEntities: []
      note: "A person's note: a short text shown to friends for 24 hours (PUT /me/note)."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: text, type: "varchar(60)", nullable: false}
        - {name: expires_at, type: timestamp, nullable: false}
        - {name: privacy, type: "varchar(10)", nullable: false, note: "public | friends | only_me; default friends"}
        - {name: created_at, type: timestamp, nullable: true}
        - {name: updated_at, type: timestamp, nullable: true}
      unique: ["(user_id)"]
      indexes:
        - {columns: [expires_at], note: "purge"}
      notes:
        - "The 60-character limit must also be enforced by Laravel validation (CHECK is not enforced on MariaDB 10.1)."

    track_columns:
      apiEntities: []
      note: "Columns added to `notes` and `stories` for an attached song (a snapshot of the catalogue entry)."
      columns:
        - {name: track_id, type: "varchar(20)", nullable: true}
        - {name: track_title, type: "varchar(200)", nullable: true}
        - {name: track_artist, type: "varchar(200)", nullable: true}
        - {name: track_artwork_url, type: "varchar(500)", nullable: true}
        - {name: track_preview_url, type: "varchar(500)", nullable: true, note: "https, apple.com or mzstatic.com hosts only"}
        - {name: track_apple_url, type: "varchar(500)", nullable: true}
        - {name: track_spotify_url, type: "varchar(500)", nullable: true}
      notes:
        - "notes.text becomes nullable: a note can be only a song."
        - "`stories.privacy` and `notes.privacy` (varchar(10), default friends) were added with the privacy choice; the allowed values must also be enforced by Laravel validation."

    user_blocks:
      apiEntities: []
      note: "Who blocked whom. A block hides the two people from each other (see PUT /users/{user}/block)."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: blocker_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: blocked_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: created_at, type: timestamp, nullable: true}
      unique: ["(blocker_id, blocked_id)"]
      indexes:
        - {columns: [blocked_id], note: "is the viewer blocked by the author"}

    reports:
      apiEntities: []
      note: "Reports of posts, comments and users, kept for the operators to review. No endpoint reads them."
      columns:
        - {name: id, type: "char(26)", nullable: false, key: primary, note: ULID}
        - {name: reporter_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: target_type, type: "varchar(10)", nullable: false, note: "post | comment | user"}
        - {name: target_id, type: "char(26)", nullable: false, note: "no foreign key: it points at one of three tables"}
        - {name: reason, type: "varchar(20)", nullable: false}
        - {name: details, type: "varchar(500)", nullable: true}
        - {name: status, type: "varchar(10)", nullable: false, note: "open | closed; default open"}
        - {name: created_at, type: timestamp, nullable: true}
      unique: ["(reporter_id, target_type, target_id)"]
      notes:
        - "Enum values must also be enforced by Laravel validation (CHECK is not enforced on MariaDB 10.1)."

    auth_codes:
      apiEntities: []
      note: "The 6-digit codes of email verification and password reset. One active code per user and purpose."
      columns:
        - {name: id, type: "bigint unsigned", nullable: false, key: primary, note: auto-increment}
        - {name: user_id, type: "char(26)", nullable: false, references: users.id, onDelete: cascade}
        - {name: purpose, type: "varchar(20)", nullable: false, note: "verify_email | reset_password"}
        - {name: code_hash, type: "char(64)", nullable: false, note: "HMAC-SHA256 of the code with the app key; the plain code only exists in the email"}
        - {name: attempts, type: "tinyint unsigned", nullable: false, default: 0, note: "wrong tries; at 5 the row is deleted"}
        - {name: expires_at, type: timestamp, nullable: false, note: "created + 15 minutes"}
        - {name: created_at, type: timestamp, nullable: true}
      unique: ["(user_id, purpose)"]
      notes:
        - "Asking for a new code replaces the row (so the old code stops working and attempts start again)."

    laravel_infrastructure:
      note: "Standard Laravel tables needed by the approved setup; not part of the API."
      tables: [jobs, job_batches, failed_jobs, migrations]

  raceConditions:
    - "like / save / hide / share: composite primary key + `INSERT IGNORE`; counters change only when a row was really inserted or deleted."
    - "story view: primary key (story_id, user_id)."
    - "conversation participant: primary key (conversation_id, user_id); direct conversation: unique `direct_key`."
    - "friend request: unique generated pair (user_low_id, user_high_id)."
    - "username and email: unique indexes are the source of truth; a duplicate key error (1062) during register is turned into a 422, the pre-check alone is not enough."
    - "notification duplicates: unique `dedupe_key`."
    - "double submit / retry: `Idempotency-Key` + unique (user_id, key)."
    - "read marker: monotonic UPDATE, never moves backwards."
    - "counters: `likes_count + 1` style atomic UPDATE inside the transaction, never read-modify-write in PHP."
