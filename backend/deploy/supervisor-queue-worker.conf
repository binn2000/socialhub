; Keeps the queue worker running (notifications, image clean-up, video conversion: needs ffmpeg and ffprobe installed, e.g. apt install ffmpeg). Put it in
; /etc/supervisor/conf.d/ and run: supervisorctl reread && supervisorctl update
; Restart it after each deploy so it loads the new code: php artisan queue:restart
[program:socialhub-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/socialhub/backend/api/artisan queue:work --sleep=3 --tries=3 --timeout=320 --max-time=3600
directory=/var/www/socialhub/backend/api
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/socialhub-queue.log
