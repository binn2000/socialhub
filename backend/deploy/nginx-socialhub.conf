# nginx site for the API. TLS certificates (certbot or your provider) go where marked.
server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    root /var/www/socialhub/backend/api/public;
    index index.php;

    # Photos are up to 10 MB; leave room for the other form fields. Keep this in step with
    # php.ini: upload_max_filesize=10M, post_max_size=12M. Bigger requests answer 413.
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Never serve dotfiles (.env) or the storage internals.
    location ~ /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
